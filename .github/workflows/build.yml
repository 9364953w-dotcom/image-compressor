name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            py_arch: arm64
            pkg_suffix: arm64
          - runner: macos-15-intel
            py_arch: x64
            pkg_suffix: x64
    runs-on: ${{ matrix.runner }}
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        architecture: ${{ matrix.py_arch }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Fetch native encoders
      run: |
        chmod +x tools/fetch_tools.sh
        tools/fetch_tools.sh

    - name: Build macOS App
      run: |
        pyinstaller --clean --noconfirm 图片压缩工具.spec
        mkdir -p dist
        ditto "dist/图片压缩工具.app" "dist/ImageCompressor.app"

    - name: Create ZIP
      run: |
        cd dist
        zip -r "ImageCompressor-macOS-${{ matrix.pkg_suffix }}.zip" "ImageCompressor.app"

    - name: Upload macOS Artifact
      uses: actions/upload-artifact@v4
      with:
        name: macos-build-${{ matrix.pkg_suffix }}
        path: dist/ImageCompressor-macOS-${{ matrix.pkg_suffix }}.zip

  build-windows:
    runs-on: windows-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Fetch oxipng
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force -Path tools/windows-x64 | Out-Null
        $ver = "9.1.5"
        $url = "https://github.com/oxipng/oxipng/releases/download/v$ver/oxipng-$ver-x86_64-pc-windows-msvc.zip"
        $zip = "oxipng.zip"
        Invoke-WebRequest -Uri $url -OutFile $zip
        Expand-Archive -Path $zip -DestinationPath oxipng-tmp -Force
        Get-ChildItem -Recurse oxipng-tmp -Filter oxipng.exe | Select-Object -First 1 | Copy-Item -Destination tools/windows-x64/oxipng.exe

    - name: Build Windows EXE
      run: pyinstaller --clean --noconfirm 图片压缩工具.spec

    - name: Create ZIP
      run: |
        cd dist
        if (Test-Path "图片压缩工具.exe") { Rename-Item -Path "图片压缩工具.exe" -NewName "ImageCompressor.exe" }
        if (Test-Path "图片压缩工具") { Rename-Item -Path "图片压缩工具" -NewName "图片压缩工具" }
        Compress-Archive -Path * -DestinationPath "ImageCompressor-Windows.zip"

    - name: Upload Windows Artifact
      uses: actions/upload-artifact@v4
      with:
        name: windows-build
        path: dist/ImageCompressor-Windows.zip

  release:
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Download macOS Artifact
      uses: actions/download-artifact@v4
      with:
        name: macos-build-arm64

    - name: Download macOS Intel Artifact
      uses: actions/download-artifact@v4
      with:
        name: macos-build-x64

    - name: Download Windows Artifact
      uses: actions/download-artifact@v4
      with:
        name: windows-build

    - name: List files
      run: ls -la

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          ImageCompressor-macOS-arm64.zip
          ImageCompressor-macOS-x64.zip
          ImageCompressor-Windows.zip
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
